[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mangaconv"
version = "0.1.0"
description = "Convert manga/comic archives (CBZ/CBR) into e-reader optimized fixed-layout EPUBs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "Pillow>=10.0",
    "unrar2-cffi>=0.8",
    "EbookLib>=0.18",
    "img2pdf>=0.5",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
mangaconv = "mangaconv.cli:main"

[tool.setuptools.packages.find]
include = ["mangaconv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
